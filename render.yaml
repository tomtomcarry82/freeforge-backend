# Render Blueprint — FreeForge free web service ($0)
# One-click deploy: connect this repo on render.com -> New -> Blueprint -> select render.yaml
services:
  - type: web
    name: freeforge
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: DATA_DIR
        value: /tmp/freeai-data
    healthCheckPath: /api/health
